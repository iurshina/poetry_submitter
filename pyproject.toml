[project]
name = "poetry-submitter"
version = "0.1.0"
description = "AI agent for tracking poems and preparing literary journal submission packages"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "playwright>=1.60.0",
    "anthropic>=0.49.0",
    "pydantic-ai>=1.107.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "reportlab>=4.5.1",
    "sqlmodel>=0.0.38",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[project.scripts]
poetry-sub = "poetry_submitter.cli:main"

[tool.ruff.lint]
select = ["E", "F", "I"]

